<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="JUDY - a editora de braindances dos seus projetos">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030305"/>
      <stop offset="0.5" stop-color="#07070c"/>
      <stop offset="1" stop-color="#0c0c14"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fce300" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fce300" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.22"/>
    </pattern>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#sky)"/>
  <circle cx="640" cy="140" r="430" fill="url(#aura)"/>

  <g fill="#fce300" opacity="0.06">
    <rect x="90"  y="214" width="3"  height="26"/>
    <rect x="210" y="224" width="3"  height="16"/>
    <rect x="340" y="208" width="3"  height="32"/>
    <rect x="470" y="220" width="3"  height="20"/>
    <rect x="590" y="212" width="3"  height="28"/>
    <rect x="720" y="226" width="3"  height="14"/>
    <rect x="850" y="216" width="3"  height="24"/>
    <rect x="980" y="222" width="3"  height="18"/>
    <rect x="1110" y="210" width="3"  height="30"/>
  </g>
  <g fill="#00f0ff" opacity="0.05">
    <rect x="150" y="218" width="3" height="22"/>
    <rect x="600" y="204" width="3" height="36"/>
    <rect x="880" y="230" width="3" height="10"/>
  </g>

  <text x="40" y="44" font-family="Courier New, monospace" font-size="14" fill="#00f0ff" opacity="0.85">RUN&gt; judy.exe --initialized</text>
  <text x="40" y="66" font-family="Courier New, monospace" font-size="14" fill="#8b949e" opacity="0.8">memoria: gavetas ok · evidencia: ok · semaforo: 4/4</text>
  <text x="1176" y="44" font-family="Courier New, monospace" font-size="14" fill="#ff2a6d" opacity="0.9">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/>
    ● REC
  </text>
  <text x="616" y="52" font-family="Courier New, monospace" font-size="15" fill="#fce300" opacity="0.9">ジャヂィ</text>

  <image href="data:image/png;base64," x="392" y="106" width="480" height="120" image-rendering="pixelated" opacity="0.0">
    <animate attributeName="opacity" values="0;0.75;0;0.75;0;0.75" dur="3.2s" repeatCount="indefinite"/>
  </image>
  <image href="data:image/png;base64," x="408" y="106" width="480" height="120" image-rendering="pixelated" opacity="0.75"/>
  <image href="data:image/png;base64," x="400" y="106" width="480" height="120" image-rendering="pixelated"/>
  <image href="data:image/png;base64," x="400" y="106" width="480" height="120" opacity="0.25" filter="url(#bloom)"/>

  <rect x="0" y="150" width="1280" height="4" fill="#fce300" opacity="0.4">
    <animate attributeName="x" values="-400;1280" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <text x="640" y="228" text-anchor="middle" font-family="Courier New, monospace" font-size="22" fill="#e6edf3">a editora de braindances dos seus projetos</text>
  <text x="640" y="258" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="#8b949e">DEV/PO · semáforo de relevância · evidência &gt; opinião</text>

  <rect width="1280" height="360" fill="url(#scanlines)"/>
</svg>
